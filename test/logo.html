<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../dist/fonts/fonts.css">
<style>html,body{margin:0;background:#3B2E6E}canvas{display:block}</style></head><body>
<!-- the logo lockup on its own, at full size and at corner sizes: node test/shot.js-style capture of test/logo.html -->
<script src="../src/art_core.js"></script>
<script src="../src/art_gennady.js"></script>
<script src="../src/art_world.js"></script>
<script>
Promise.all(['900 40px "Big Shoulders Stencil"', '800 20px "Archivo"'].map((f) => document.fonts.load(f))).then(() => {
  const big = HomingWorld.logo(1);
  const c = document.createElement('canvas'); c.width = 1400; c.height = 760;
  const x = c.getContext('2d');
  const g = x.createLinearGradient(0, 0, 0, 760); g.addColorStop(0, '#2A1F4F'); g.addColorStop(1, '#93407F');
  x.fillStyle = g; x.fillRect(0, 0, 1400, 760);
  x.drawImage(big, 20, 20);
  x.imageSmoothingQuality = 'high';
  x.drawImage(big, 1040, 40, 330, 148);
  x.drawImage(big, 1040, 240, 152, 68);
  document.body.appendChild(c);
  document.title = 'ready';
});
</script></body></html>

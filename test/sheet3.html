<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="fonts.css">
<style>body{margin:0;background:#2B2350}canvas{display:block}</style></head><body>
<canvas id="out"></canvas>
<script src="../src/art_core.js"></script>
<script src="../src/art_symbols.js"></script>
<script src="../src/art_birds.js"></script>
<script src="../src/art_world.js"></script>
<script>
(async function(){
  await Promise.all(['900 40px "Big Shoulders Stencil"','700 20px Archivo'].map(f=>document.fonts.load(f)));
  const out = document.getElementById('out'); out.width = 1920; out.height = 1200;
  const x = out.getContext('2d');
  const bands = ['#2B2350','#4A3B7A','#7A3F87','#C2477F','#F06A6A','#FF8A3D','#FFC857'];
  bands.forEach((c,i)=>{ x.fillStyle=c; x.fillRect(0, i*120, 1920, 140); });
  const W = HomingWorld;
  x.drawImage(W.cloud(0,'#F6A9B8','#E5799A'), 200, 120);
  x.drawImage(W.cloud(1,'#F6A9B8','#E5799A'), 1300, 200);
  x.fillStyle = '#3A2766'; x.fillRect(0, 700, 1920, 500);
  x.drawImage(W.tram(), 1400, 640);
  const loft = W.paintLoft(1, 4);
  const s = 0.95, lx = 960 - W.LOFT.w*s/2, ly = 1200 - W.LOFT.h*s;
  x.drawImage(loft, lx, ly, W.LOFT.w*s, W.LOFT.h*s);
  const kinds = ['T','J','Q','K','A','BINO','SEED','TEA','RAD','CHAMP','GENA','BIRD','CLOCK'];
  const cache = {};
  for (let r=0;r<5;r++) for (let c=0;c<6;c++){
    const k = kinds[(r*7+c*3)%kinds.length];
    if (!cache[k]) cache[k] = W.sticker(HomingSymbols.paintSymbol(k,1,2), 12);
    const b = W.cellRect(c,r);
    const sz = 168;
    x.drawImage(cache[k], lx + (b.x + b.w/2)*s - sz*s/2, ly + (b.y + b.h/2)*s - sz*s/2, sz*s, sz*s);
  }
  x.drawImage(HomingBirds.flight('up','white',true,1), 300, 60, 160, 140);
  x.drawImage(HomingBirds.flight('glide','grey',true,1), 1500, 40, 160, 140);
  x.drawImage(W.dish(), 1560, 900); x.drawImage(W.vent(), 1720, 960);
  [0,1,2,3].forEach(i=>x.drawImage(W.laundry(i), 40+i*120, 820, 110, 125));
  x.drawImage(W.medallion(), 100, 380, 220, 220);
  x.drawImage(W.splat(3,'#FF4FA3'), 1600, 380); x.drawImage(W.feather(), 1700, 380); x.drawImage(W.sparkle('#FFD23F'), 1780, 380);
  x.drawImage(W.neighbour('#F2675E', true), 1580, 520); x.drawImage(W.neighbour('#2C6BD8', false), 1680, 520);
  x.drawImage(W.banner(600,140,'#FF4FA3'), 640, 40);
  document.title='ready';
})();
</script></body></html>
